name: Build and publish Talksy Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../Talksy.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ChatKaro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talksy-Android-APK
          path: Talksy.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Talksy.apk ChatKaro.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Talksy Android APK ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android APK build from commit ${GITHUB_SHA}. This debug-signed APK is for testing. A production release should use a protected signing key." \
            --latest

      - name: Publish APK to same-origin frontend download
        working-directory: .
        run: |
          mkdir -p frontend/public
          cp Talksy.apk frontend/public/Talksy.apk
          cp Talksy.apk frontend/public/ChatKaro.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/Talksy.apk frontend/public/ChatKaro.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Talksy APK for direct website download"
            git push
          fi
