name: Prepare Firebase dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Firebase branch
        uses: actions/checkout@v4
        with:
          ref: feature/firebase-email-verification
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Regenerate frontend lockfile and build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Regenerate backend lockfile and verify install
        working-directory: backend
        run: |
          npm install
          npm ci

      - name: Commit updated lockfiles
        run: |
          if git diff --quiet -- frontend/package-lock.json backend/package-lock.json; then
            echo "Lockfiles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          git commit -m "Update lockfiles for Firebase authentication"
          git push origin HEAD:feature/firebase-email-verification
